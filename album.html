<!DOCTYPE html>
<html>

<head>                      <!-- La balise head contient les informations pour que la navigateur prépare la page -->
    <title>Album</title>                        <!-- Affiche un Titre "Album" sur l'onglet de la page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      <!-- La ligne viewport permet d'ajuster la largeur de la page à la taille réelle de l'écran  -->
    <link rel="stylesheet" href="style.css">    <!-- Charge la feuille de style style.css -->
</head>

<body>

    <header>
        <h1 id="album"></h1> 
        <h2 id="artist"></h2>
    </header>

    <main>
        <img id="cover">     <!-- La balise <img> permet d'afficher une image. -->

        <p id="info">
            <span id="year"></span> -
            <span id="albumlength"></span> -
            <span id="tracks"></span> Tracks
        </p>

        <section id="links">

            <a id="deezer">Deezer</a>    <!-- La balise <a> correspond à une définition d'hyperlink. Après l'Id, on écrit ce qui est affiché sur la page -->
            <a id="spotify">Spotify</a>
            <a id="applemusic">Apple Music</a>
            <a id="soundcloud">SoundCloud</a>
          
        </section>

        <section id="clip">
            <iframe id="youtube"></iframe>
        </section>
    </main>

    <script>  //<!-- les navigateurs comprennent qu'il faut exécuter du JavaScript après une balise HTML <script> -->
        const params = new URLSearchParams(window.location.search);  //window.location.search récupère la partie de l'URL située après "?", par exemple "id=album1", et la stocke dans params
        const id = params.get("id");      //Ici on récupère uniquement la valeur de l'id à partir de params, par exemple "album1", et o, stock dans "id"

        fetch("Albums/" + id + ".json")    //fetch demande au navigateur de récupérer une ressource. Cela peut prendre un petit moment, d'où "then" après. Ici la ressources est variabilisée graçe à l'Id passé dans l'Url
            .then(response => response.json())    //Then = Une fois que tu as reçu la réponse du serveur, interprète la en JSON. 
            .then(data => {                       //Then = Après l'interprétation de la réponse JSON, renomme la "data".
                document.getElementById("album").textContent = data.album;      //Le JSON est désormais un objet appelé data, on peut donc appeler ses variables avec data.variable
                document.getElementById("artist").textContent = data.artist;    //"document" représente la page HTML actuelle  
                //document.getElementById("date").textContent = data.date;        //On assigne à l'Id de la page HTML actuelle le contenu de la variable du JSON (data.xxxx)
                document.getElementById("albumlength").textContent = data.albumlength;
                document.getElementById("tracks").textContent = data.tracks;
                document.getElementById("year").textContent = data.year;

                document.getElementById("deezer").href = data.deezer;           //Pour les liens, .href modifie la destination du lien, (lien caché)   
                document.getElementById("spotify").href = data.spotify;
                document.getElementById("applemusic").href = data.applemusic;
                document.getElementById("soundcloud").href = data.soundcloud;

                //iFrame Youtube
                const videoId = data.clip.split("/").pop().split("?")[0];                              //split("/").pop().split("?")[0] Isole l'identifiant video contenu dans le lien
                document.getElementById("youtube").src ="https://www.youtube.com/embed/" + videoId;    //On reformule le lien avec embed pour faire fonctionner l'aperç youtube

                document.getElementById("cover").src = data.cover;              //Pour les images, .src permet de définir la source de l'image qui sera affichée via une balise HTML <img>
            });
    </script>

</body>
</html>
